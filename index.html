<!DOCTYPE html>

<title>CPCCBC4018 Virtual Survey Exercise</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    margin:0;
}

.header{
    background:#1f4e79;
    color:white;
    padding:20px;
}

.header h1{
    margin:0;
}

.site-wrapper{
    position:relative;
    width:1200px;
    margin:20px auto;
}

.site-image{
    width:100%;
    display:block;
}

.point{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:transparent;
    border:2px solid transparent;
}

.point:hover{
    border:2px solid #00aaff;
    box-shadow:0 0 8px #00aaff;
}

.viewed{
    border:2px solid orange;
    box-shadow:0 0 8px orange;
}

.datum{
    border:2px solid #0066cc;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:white;
    width:900px;
    max-width:95%;
    padding:20px;
    border-radius:10px;
}

.modal-content img{
    width:100%;
    max-height:70vh;
    object-fit:contain;
}

.close-btn{
    margin-top:15px;
    padding:10px 20px;
    background:#1f4e79;
    color:white;
    border:none;
    cursor:pointer;
}

.instructions{
    max-width:1200px;
    margin:20px auto;
    background:white;
    padding:15px;
}

</style>
</head>

<div class="modal" id="modal">

    <div class="modal-content">

        <h2 id="title"></h2>

        <p>
            Observe the staff reading and record it in your workbook.
        </p>

        <img id="photo">

        <button class="close-btn" onclick="closeModal()">
            Close
        </button>

    </div>

</div>

<script>

let viewedPoints = new Set();

function openPoint(title,image,button){

    document.getElementById("title").innerHTML = title;

    document.getElementById("photo").src = image;

    document.getElementById("modal").style.display = "flex";

    button.classList.add("viewed");

    if(title !== "Datum Point"){

        viewedPoints.add(title);

        document.getElementById("viewCount").innerHTML =
        viewedPoints.size;
    }
}

function closeModal(){

    document.getElementById("modal").style.display = "none";
}

window.onclick = function(event){

    const modal = document.getElementById("modal");

    if(event.target === modal){

        closeModal();
    }
};

</script>
