body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;

.header{
    background:#1f4e79;
    color:white;
    padding:20px;

.site-wrapper{
    position:relative;
    max-width:1200px; /* responsive */
    width:100%;
    margin:20px auto;
}

.site-image{
    width:100%;
    display:block;
}

.point{
    position:absolute;
    /* larger invisible hit area for touch while the visual dot is the pseudo-element */
    width:32px;
    height:32px;
    transform:translate(-50%,-50%); /* center the element on the coordinates */
    background:transparent;
    border:none;
    cursor:pointer;
}

.point::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:12px;
    height:12px;
    border-radius:50%;
    background:transparent;
    border:2px solid transparent;
    box-sizing:border-box;
    pointer-events:none; /* visual element doesn't intercept pointer events */
}

.point:hover::after{
    border-color:#00aaff;
    box-shadow:0 0 8px #00aaff;
}

.point:focus::after{
    outline:2px solid #00aaff;
    box-shadow:0 0 8px #00aaff;
}

.viewed::after{
    border-color:orange;
    box-shadow:0 0 8px orange;
}

.datum::after{
    border-color:#0066cc;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content{
    background:white;
    width:900px;
    max-width:95%;
    padding:20px;
    border-radius:10px;
}

.modal-content img{
    width:100%;
    max-height:70vh;
    object-fit:contain;
}

.close-btn{
    margin-top:15px;
    padding:10px 20px;
    background:#1f4e79;
    color:white;
    border:none;
    cursor:pointer;
}

.instructions{
    max-width:1200px;
    margin:20px auto;
    background:white;
    padding:15px;
}

</style>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title">

        <h2 id="title"></h2>

            Observe the staff reading and record it in your workbook.
        </p>

        <img id="photo" alt="">

        <button class="close-btn" onclick="closeModal()" type="button">
            Close
        </button>

    </div>

<script>

let viewedPoints = new Set();
let lastFocusedElement = null;

function openPoint(title,image,button){

    // set modal title and image
    document.getElementById("title").innerHTML = title;

    const photo = document.getElementById("photo");
    photo.src = image;
    photo.alt = title + " staff reading";

    // remember which element opened the modal so we can restore focus
    lastFocusedElement = button;

    // show modal and move focus into it
    const modal = document.getElementById("modal");
    modal.style.display = "flex";

    // mark point as viewed visually
    button.classList.add("viewed");

    // update viewed count (exclude datum)
    if(title !== "Datum Point"){
        viewedPoints.add(title);
        document.getElementById("viewCount").innerHTML = viewedPoints.size;
    }

    // focus the close button for keyboard users
    const closeBtn = document.querySelector('.close-btn');
    if(closeBtn){
        closeBtn.focus({preventScroll:true});
    }
}

function closeModal(){

    const modal = document.getElementById("modal");
    modal.style.display = "none";

    // restore focus to the last opened point button
    if(lastFocusedElement && typeof lastFocusedElement.focus === 'function'){
        lastFocusedElement.focus({preventScroll:true});
        lastFocusedElement = null;
    }
}

window.onclick = function(event){

    const modal = document.getElementById("modal");

    if(event.target === modal){

        closeModal();
    }
};

// close modal with Escape key
window.addEventListener('keydown', function(e){
    const modal = document.getElementById('modal');
    if(modal.style.display === 'flex' && e.key === 'Escape'){
        closeModal();
    }
});

</script>
